data:
  raw_path: data/online_shoppers_intention.csv
  target: Revenue
  test_size: 0.20
  random_state: 42

model:
  type: random_forest
  n_estimators: 500
  max_depth: 15
  class_weight: balanced

training:
  primary_metric: f1
  minimum_f1: 0.40

mlflow:
  experiment_name: ecommerce_conversion
  data_version: v1